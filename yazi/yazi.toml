[mgr]
linemode        = "size"
ratio           = [2,4,4]
show_hidden     = true
sort_by         = "alphabetical"
sort_dir_first  = true
sort_sensitive  = false
sort_reverse    = false
sort_translit   = true

[shell]
shell = "zsh"

[tasks]
bizarre_retry = 5
macro_workers = 10
micro_workers = 5

[preview]
max_width     = 1400
max_height    = 1200

[input]
cursor_blink  = true

####################### plugin #######################
# yazi config

# exif-image
[plugin]
prepend_previewers = [
  # iPhone 的 HEIC/HEIF：先用 sips 转 JPEG 再显示（plugins/heic.yazi）
  { url = "*.heic", run = "heic" },
  { url = "*.heif", run = "heic" },
  { mime = "image/*", run = "exif-image" }
]

# git 状态（plugins/git.yazi，配合 cfg-git.lua 的 setup）
# 文件列表右侧显示 M/A/? 等标记；yazi > 26.1.22 不需要 id 字段
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
